<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML Practice 6 - Tables</title>

<style>
  body{
    font-family: Arial, Helvetica, sans-serif;
    background:#ffffff;
  }

  .centerDiv{
    text-align:center;
    margin-top:40px;
  }

  table.schedule{
    width:550px;
    margin:0 auto;
    border-collapse:collapse;
    background:#fff;
  }

  caption.titleStyle{
    font-size:1.5em;
    font-weight:bold;
    color:#003300;
    padding:10px;
  }

  table.schedule th,
  table.schedule td{
    border:2px solid #666;
    padding:8px;
    text-align:center;
    vertical-align:middle;
  }

  .coursesCol{
    background-color:#cccccc;
    width:25%;
    font-weight:bold;
  }

  .daysCol{
    width:15%;
  }

  .dayHead{
    background-color:#99ff66;
    font-weight:bold;
  }
</style>
</head>

<body>
<div class="centerDiv">

<table class="schedule" border="2" cellspacing="0" cellpadding="6">
  <caption class="titleStyle">My Class Schedule</caption>

  <colgroup class="coursesCol"></colgroup>
  <colgroup class="daysCol" span="5"></colgroup>

  <tr>
    <th class="coursesCol">Courses</th>
    <th class="dayHead">Monday</th>
    <th class="dayHead">Tuesday</th>
    <th class="dayHead">Wednesday</th>
    <th class="dayHead">Thursday</th>
    <th class="dayHead">Friday</th>
  </tr>

  <tr>
    <th class="coursesCol">INFO 1120</th>
    <td></td>
    <td>9-11</td>
    <td></td>
    <td>9-11</td>
    <td rowspan="2"></td>
  </tr>

  <tr>
    <th class="coursesCol">MATH 1010</th>
    <td></td>
    <td colspan="3">12-1</td>
  </tr>

  <tr>
    <th class="coursesCol">INFO 2420</th>
    <td colspan="5">Online Available 24/7</td>
  </tr>
</table>

</div>
</body>
</html>
