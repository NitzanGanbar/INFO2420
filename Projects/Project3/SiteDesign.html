<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Site Design – Rent A Pet</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  background-color:#ffffff;
  margin:40px;
}

h1{
  color:#0b4aa2;
}

.colorBox{
  width:200px;
  height:100px;
  margin-bottom:10px;
}

.label{
  margin-bottom:30px;
}
</style>

</head>

<body>

<h1>Rent A Pet – Site Color Palette</h1>

<h2>Primary Background Color</h2>
<div class="colorBox" style="background-color:#f4f4f4;"></div>
<div class="label">#f4f4f4</div>

<h2>Primary Text Color</h2>
<div class="colorBox" style="background-color:#222222;"></div>
<div class="label">#222222</div>

<h2>Heading & Link Color</h2>
<div class="colorBox" style="background-color:#0b4aa2;"></div>
<div class="label">#0b4aa2</div>

<h2>Visited Link Color</h2>
<div class="colorBox" style="background-color:#6a2ca0;"></div>
<div class="label">#6a2ca0</div>

<h2>Accent / Hover Color</h2>
<div class="colorBox" style="background-color:#c0392b;"></div>
<div class="label">#c0392b</div>

</body>
</html>
