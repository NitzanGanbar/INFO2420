<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nitzan Hotel - Graphics</title>

<style type="text/css">

    body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background-color: #0a2540;
        color: #ffffff;
        text-align: center;
    }

    h1 {
        margin-top: 30px;
        color: #d4af37;
    }

    h2 {
        color: #ffffff;
        margin-top: 35px;
    }

    .section {
        margin: 25px auto;
        width: 900px;
        max-width: 95%;
        padding: 15px;
    }

    #thumbs, #image {
        width: 900px;
        max-width: 95%;
        text-align: center;
        margin: 0 auto 0 auto;
        color: #000000;
        background-color: #f4f1ea;
        padding: 10px;
        box-sizing: border-box;
        border: 2px solid #d4af37;
    }

    #thumbs {
        margin-top: 10px;
    }

    #thumbs img {
        border: solid 1px #000000;
        margin: 5px;
        width: 150px;
        height: 100px;
        object-fit: cover;
        cursor: pointer;
    }

    #image {
        height: 500px;
    }

    #image img {
        width: 400px;
        height: 267px;
        object-fit: cover;
        margin-top: 10px;
        border: solid 1px #000000;
    }

    .instructions {
        font-style: italic;
    }

    .background-preview {
        width: 900px;
        max-width: 95%;
        border: 2px solid #d4af37;
    }

    a img {
        border: none;
    }

</style>

<script type="text/javascript">

    var PrintButton1 = new Image();
    var PrintButton2 = new Image();
    var logo1 = new Image();
    var logo2 = new Image();

    if (document.images) {
        PrintButton1.src = "images/PrintPage1.png";
        PrintButton2.src = "images/PrintPage2.png";
        logo1.src = "images/logo1.png";
        logo2.src = "images/logo2.png";
    }

    var imgArray = new Array(
        'image1lg.png',
        'image2lg.png',
        'image3lg.png',
        'image4lg.png'
    );

    var titleArray = new Array(
        'Poolside Experience',
        'Luxury Guest Room',
        'Elegant Hotel Lobby',
        'Relaxing Spa Lobby'
    );

    var imgPath = "images/fullsize/";

    function swapImage(imgID) {
        var theImage = document.getElementById('theImage');
        var textDiv = document.getElementById('bottomText');

        var newImg;
        var textTitle;

        newImg = imgArray[imgID];
        theImage.src = imgPath + newImg;

        textTitle = titleArray[imgID];
        textDiv.innerHTML = textTitle;
    }

    function preloadImages() {
        for (var i = 0; i < imgArray.length; i++) {
            var tmpImg = new Image();
            tmpImg.src = imgPath + imgArray[i];
        }
    }

</script>

</head>

<body onload="preloadImages()">

<div align="center">

    <h1>Nitzan Hotel</h1>

    <div class="section">
        <h2>Print Button Rollover</h2>
        <a href="#"
           onmouseover="document.PrintButton.src=PrintButton2.src;"
           onmouseout="document.PrintButton.src=PrintButton1.src;">
            <img src="images/PrintPage1.png" width="200" height="50"
                 name="PrintButton" alt="Print Page Button" />
        </a>
    </div>

    <div class="section">
        <h2>Logo Rollover</h2>
        <a href="#"
           onmouseover="document.logo.src=logo2.src;"
           onmouseout="document.logo.src=logo1.src;">
            <img src="images/logo1.png" width="133" height="126"
                 name="logo" alt="Nitzan Hotel Logo" />
        </a>
    </div>

    <div class="section">
        <h2>Image Swap</h2>

        <div id="thumbs">
            <img src="images/thumbnails/image1sm.png" alt="Poolside Experience thumbnail" onmouseover="swapImage(0);" />
            <img src="images/thumbnails/image2sm.png" alt="Luxury Guest Room thumbnail" onmouseover="swapImage(1);" />
            <img src="images/thumbnails/image3sm.png" alt="Relaxing Spa Lobby thumbnail" onmouseover="swapImage(3);" />
            <img src="images/thumbnails/image4sm.png" alt="Elegant Hotel Lobby thumbnail" onmouseover="swapImage(2);" />
        </div>

        <div id="image">
            <p class="instructions">Move your mouse over a thumbnail to change the large image.</p>
            <img id="theImage" src="images/fullsize/image1lg.png" alt="Luxury Guest Room" />
            <h3 id="bottomText">Luxury Guest Room</h3>
        </div>
    </div>

    <div class="section">
        <h2>Two Column Background Image</h2>
        <img src="images/2colback.png" alt="Two-column background image" class="background-preview" />
    </div>

</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer">
        <img src="http://www.w3.org/Icons/valid-xhtml10"
             alt="Valid XHTML 1.0 Transitional" height="31" width="88" />
    </a>
</p>

</body>
</html>
