<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nitzan Hotel - Graphics</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background-color: #f4f1ea;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .section {
            margin: 40px auto;
            max-width: 800px;
        }

        img {
            width: 100%;
            border: 3px solid #d4af37;
        }

        .logo img {
            width: 150px;
        }
    </style>
</head>
<body>

    <h1>Nitzan Hotel Graphics</h1>

    <div class="section">
        <h2>Banner</h2>
        <img src="images/Bunner/NitzanHotelBunner.png" alt="Hotel Banner">
    </div>

    <div class="section logo">
        <h2>Logo</h2>
        <img src="images/Logo/NitzanHotelLogo.png" alt="Hotel Logo">
    </div>

</body>
</html>
